<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架空プロフィール・学習例</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>山田の自己紹介</h1>
      <nav aria-label="ページ内">
        <ul>
          <li><a href="#hobby">趣味</a></li>
          <li><a href="#goal">学習目標</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <article class="profile-card">
        <img src="images/profile.svg" alt="プロフィール用の丸いイラスト" class="profile-card__img">
        <h2>山田</h2>
        <p>Web制作を学ぶ架空の受講生です。</p>

        <section id="hobby">
          <h3>趣味</h3>
          <p>散歩と読書。日常のデザインを観察しています。</p>
        </section>

        <section id="goal">
          <h3>学習目標</h3>
          <p>自分の言葉で意図を説明できるページを作ることです。</p>
        </section>
      </article>

      <section class="cta-section">
        <h2>一緒に学びませんか？</h2>
        <div class="cards">
          <article>
            <h3>小さく作る</h3>
            <p>一つの機能から実装します。</p>
          </article>
          <article>
            <h3>確かめる</h3>
            <p>表示と動作を確認します。</p>
          </article>
          <article>
            <h3>説明する</h3>
            <p>変更の理由を記録します。</p>
          </article>
        </div>
        <a class="btn" href="#goal">学習目標を見る</a>
      </section>
    </main>

    <footer>
      <p>REBOOT CAMP 学習用の架空例</p>
    </footer>
  </body>
</html>
